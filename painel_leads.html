<!doctype html><html lang=pt-BR><head><meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel de Leads · IDM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f4;--surface:#fff;--surface-2:#eef2ef;--fg:#17201c;--muted:#5e6b64;--line:#e0e5e0;
--brand:#0f5b4e;--brand-soft:#e4efe9;--accent:#b0863f;
--hot:#c6472c;--hot-soft:#f7e6e0;--warm:#b9872a;--warm-soft:#f6edda;--cold:#3f79a8;--cold-soft:#e2ecf4;
--cs:#1e7d4f;--cs-soft:#e4f1ea;--op:#6b7a73;--op-soft:#edf0ee;--rev:#8a5a2b;--rev-soft:#f3e9df;
--shadow:0 1px 2px rgba(20,40,32,.06),0 8px 24px rgba(20,40,32,.05);--r:16px;
--fdisp:"Fraunces",Georgia,serif;--fbody:"Public Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1512;--surface:#131d19;--surface-2:#182420;
--fg:#e9efea;--muted:#9db0a7;--line:#24332d;--brand:#3cae96;--brand-soft:#15302a;--accent:#d0a561;
--hot:#e4785a;--hot-soft:#2c1712;--warm:#d6a948;--warm-soft:#2a2210;--cold:#6aa6d4;--cold-soft:#122230;
--cs:#43b184;--cs-soft:#15302a;--op:#9db0a7;--op-soft:#182420;--rev:#d0a561;--rev-soft:#2a2210;
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1512;--surface:#131d19;--surface-2:#182420;--fg:#e9efea;--muted:#9db0a7;--line:#24332d;
--brand:#3cae96;--brand-soft:#15302a;--accent:#d0a561;--hot:#e4785a;--hot-soft:#2c1712;--warm:#d6a948;--warm-soft:#2a2210;
--cold:#6aa6d4;--cold-soft:#122230;--cs:#43b184;--cs-soft:#15302a;--op:#9db0a7;--op-soft:#182420;--rev:#d0a561;--rev-soft:#2a2210;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--fbody);line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--fdisp);font-weight:600;margin:0}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.brand h1{font-size:1.4rem;letter-spacing:-.01em}
.brand .tag{font-size:.9rem;color:var(--brand);font-weight:700}
.upd{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cs);box-shadow:0 0 0 4px var(--brand-soft)}
section{margin-top:24px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-head h2{font-size:1.15rem}.sec-head .hint{font-size:.8rem;color:var(--muted)}
.therm{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:860px){.therm{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.therm{grid-template-columns:1fr}}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);
position:relative;overflow:hidden;display:flex;flex-direction:column;gap:9px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(20,40,32,.08),0 14px 30px rgba(20,40,32,.1)}
.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tcard::before{content:"";position:absolute;inset:0 auto 0 0;width:5px}
.tcard.hot::before{background:var(--hot)}.tcard.warm::before{background:var(--warm)}.tcard.cold::before{background:var(--cold)}.tcard.cs::before{background:var(--cs)}
.tcard .top{display:flex;align-items:center;justify-content:space-between}
.pill{font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:999px}
.pill.hot{background:var(--hot-soft);color:var(--hot)}.pill.warm{background:var(--warm-soft);color:var(--warm)}.pill.cold{background:var(--cold-soft);color:var(--cold)}.pill.cs{background:var(--cs-soft);color:var(--cs)}
.tcard .num{font-family:var(--fdisp);font-size:2.9rem;line-height:1;font-weight:600}
.tcard .def{font-size:.84rem;color:var(--muted)}
.tcard .open-h{margin-top:auto;font-size:.76rem;color:var(--brand);font-weight:700}
.fora{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:520px){.fora{grid-template-columns:1fr}}
.mcard{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;align-items:center;gap:14px}
.mcard:hover{background:var(--surface-2)}.mcard:focus-visible{outline:2px solid var(--accent)}
.mcard .mnum{font-family:var(--fdisp);font-size:1.8rem;font-weight:600;min-width:42px}
.mcard.op .mnum{color:var(--op)}.mcard.rev .mnum{color:var(--rev)}
.mcard .ml{font-size:.82rem;color:var(--muted)}.mcard .ml b{color:var(--fg)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:18px;font-size:.82rem;color:var(--muted)}
.note b{color:var(--fg)}
footer{margin:28px 0 14px;font-size:.76rem;color:var(--muted);text-align:center}
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--surface);z-index:50;box-shadow:-12px 0 40px rgba(10,20,16,.3);transform:translateX(100%);transition:transform .24s;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.dhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dhead h2{font-size:1.1rem}
.iconbtn{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;width:34px;height:34px;cursor:pointer;color:var(--fg);font-size:1rem}
.dbody{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.llist{display:flex;flex-direction:column;gap:10px}
.litem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);text-align:left;font:inherit;color:inherit;width:100%}
.litem:hover{background:var(--surface-2)}.litem .nm{font-weight:600}.litem .mt{font-size:.8rem;color:var(--muted)}.litem .go{margin-left:auto;color:var(--brand);font-weight:700}
.idt{display:inline-block;font-size:.66rem;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:9px;background:var(--op-soft);color:var(--op);margin-top:3px}
.idt.cli{background:var(--cs-soft);color:var(--cs)}.idt.lead{background:var(--warm-soft);color:var(--warm)}
.back{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;font:inherit;padding:0;display:flex;align-items:center;gap:6px}
.lead-head .nm{font-family:var(--fdisp);font-size:1.3rem;font-weight:600}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.tel{font-size:.85rem;color:var(--muted)}
.jar{border:1px solid var(--brand);border-radius:14px;overflow:hidden;margin-top:4px}
.jar .jh{display:flex;align-items:center;gap:10px;background:var(--brand-soft);padding:11px 14px;font-weight:700;color:var(--brand)}
.jar .jh .av{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--fdisp);font-size:.9rem}
.jar .jbody{padding:14px;display:flex;flex-direction:column;gap:14px}
.block .t{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}
.block p{margin:0;font-size:.92rem;white-space:pre-wrap}
.msg{background:var(--surface-2);border-left:3px solid var(--brand);border-radius:8px;padding:11px 13px;font-size:.92rem;white-space:pre-wrap}
.msg .lab{font-size:.72rem;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
.cp{margin-top:10px;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}
.cp:active{opacity:.8}
.load{color:var(--muted);font-size:.9rem;padding:22px 0;text-align:center}
@media(max-width:720px){.drawer{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="wrap head">
  <div class="brand"><h1>Painel de Leads</h1><span class="tag">IDM · Instituto Dayane Mafra</span></div>
  <div class="upd"><span class="dot"></span><span id=upd>carregando…</span></div>
</div></header>
<div class="wrap">
  <section>
    <div class="sec-head"><h2>Termômetro de leads</h2><span class="hint">clique num grupo pra ver quem está nele e a análise do Jarbas</span></div>
    <div class="therm">
      <button class="tcard hot" id="t_quente" onclick="openGroup('quente')"><div class="top"><span class="pill hot">🔥 Quente</span></div><div class="num" id="n_quente">—</div><div class="def">Pronto pra avançar: pediu preço/agenda ou decisão clara.</div><div class="open-h">Ver leads ›</div></button>
      <button class="tcard warm" id="t_morno" onclick="openGroup('morno')"><div class="top"><span class="pill warm">🌤️ Morno</span></div><div class="num" id="n_morno">—</div><div class="def">Tem interesse, mas sem urgência nem data.</div><div class="open-h">Ver leads ›</div></button>
      <button class="tcard cold" id="t_frio" onclick="openGroup('frio')"><div class="top"><span class="pill cold">❄️ Frio</span></div><div class="num" id="n_frio">—</div><div class="def">Sem engajamento real, parado ou sumiu. Dá pra resgatar.</div><div class="open-h">Ver leads ›</div></button>
      <button class="tcard cs" id="t_cross" onclick="openGroup('cross_sell')"><div class="top"><span class="pill cs">💰 Cross-sell</span></div><div class="num" id="n_cross">—</div><div class="def">Cliente que já comprou e quer comprar algo novo.</div><div class="open-h">Ver leads ›</div></button>
    </div>
    <div class="fora">
      <button class="mcard op" onclick="openGroup('operacional')"><div class="mnum" id="n_op">—</div><div class="ml"><b>⚙️ Operacional · fora do funil</b><br>Cliente tratando logística do que já tem (vai pra frente de pacotes ativos).</div></button>
      <button class="mcard rev" onclick="openGroup('revisar')"><div class="mnum" id="n_rev">—</div><div class="ml"><b>🔁 Revisar</b><br>Classificação a refazer — reclassifica sozinho no próximo ciclo.</div></button>
    </div>
    <div class="note"><span>ℹ️</span><div id="stat">—</div></div>
  </section>
  <footer>IDM · Painel de Leads — termômetro ao vivo · atualiza sozinho a cada ~90s</footer>
</div>
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Detalhe">
  <div class="dhead" id="dhead"></div>
  <div class="dbody" id="dbody"></div>
</aside>
<script>
const base=location.pathname.replace(/\/leads\/?$/,'');
const E=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const LABEL={quente:'🔥 Quente',morno:'🌤️ Morno',frio:'❄️ Frio',cross_sell:'💰 Cross-sell',operacional:'⚙️ Operacional',revisar:'🔁 Revisar'};
let DATA={};
async function carrega(){
  try{
    const r=await fetch(base+'/termometro.json',{cache:'no-store'}).then(r=>r.json());
    const x=r.result||{};DATA=x;const c=x.contagem||{};
    E('n_quente').textContent=c.quente||0;E('n_morno').textContent=c.morno||0;E('n_frio').textContent=c.frio||0;E('n_cross').textContent=c.cross_sell||0;
    E('n_op').textContent=c.operacional||0;E('n_rev').textContent=c.revisar||0;
    E('upd').textContent='Ao vivo · '+esc((r.quando||'').replace('T',' ').slice(0,16))+' · funil: '+(x.funil||0);
    E('stat').innerHTML='<b>'+(x.total||0)+'</b> conversas na inbox · <b>'+(c.pendente||0)+'</b> aguardando classificação (enchem +'+(x.classificadas_no_ciclo||0)+'/ciclo) · fonte: '+esc(x.fonte||'inbox');
  }catch(e){E('upd').textContent='erro ao carregar';}
}
function openDrawer(){E('drawer').classList.add('open');E('scrim').classList.add('open');E('drawer').setAttribute('aria-hidden','false');}
function closeDrawer(){E('drawer').classList.remove('open');E('scrim').classList.remove('open');E('drawer').setAttribute('aria-hidden','true');}
function openGroup(key){
  const arr=DATA[key]||[];
  E('dhead').innerHTML='<h2>'+esc(LABEL[key])+' — '+arr.length+'</h2><button class="iconbtn" aria-label="Fechar" onclick="closeDrawer()">✕</button>';
  if(!arr.length){E('dbody').innerHTML='<div class=load>Nenhum lead neste grupo agora.</div>';openDrawer();return;}
  let h='<div class=llist>';
  arr.forEach((l,i)=>{
    const idc=l.identidade=='cliente'?'cli':(l.identidade=='lead_cadastrado'?'lead':'');
    const idl=l.identidade=='cliente'?'cliente':(l.identidade=='lead_cadastrado'?'lead no CE':'novo');
    h+='<button class=litem onclick="openLead(\''+key+'\','+i+')"><div><div class=nm>'+(esc(l.nome)||'(sem nome)')+'</div><div class=mt>'+esc(l.telefone||'')+'</div><span class="idt '+idc+'">'+idl+'</span></div><span class=go>›</span></button>';
  });
  h+='</div>';E('dbody').innerHTML=h;E('dbody').scrollTop=0;openDrawer();
}
async function openLead(key,i){
  const l=(DATA[key]||[])[i];if(!l)return;
  E('dhead').innerHTML='<button class=back onclick="openGroup(\''+key+'\')">‹ voltar</button><button class="iconbtn" aria-label="Fechar" onclick="closeDrawer()">✕</button>';
  E('dbody').innerHTML='<div class="lead-head"><div class=nm>'+(esc(l.nome)||'(sem nome)')+'</div><div class=meta><span class=tel>'+esc(l.telefone||'')+'</span></div></div>'+
    '<div class="jar"><div class="jh"><span class=av>J</span> Análise do Jarbas · super-vendedor</div><div class="jbody"><div class=load>Jarbas lendo a conversa real…</div></div></div>';
  E('dbody').scrollTop=0;
  try{
    const a=await fetch(base+'/analise?conv_id='+encodeURIComponent(l.conv)+'&nome='+encodeURIComponent(l.nome||'')+'&identidade='+encodeURIComponent(l.identidade||''),{cache:'no-store'}).then(r=>r.json());
    const jb=document.querySelector('.jar .jbody');
    if(!a.ok){jb.innerHTML='<div class=load>Sem análise: '+esc(a.motivo||'erro')+'</div>';return;}
    window._msg=a.mensagem||'';
    jb.innerHTML='<div class=block><div class=t>Diagnóstico</div><p>'+esc(a.diagnostico)+'</p></div>'+
      '<div class=block><div class=t>Próxima condução</div><p>'+esc(a.conducao)+'</p></div>'+
      '<div class=block><div class=t>Sugestão de mensagem</div><div class=msg><span class=lab>Pronta pra enviar · método Instituto</span>'+esc(a.mensagem)+'</div><button class=cp onclick="cp()">📋 Copiar mensagem</button></div>'+
      (a.cache?'<div class=load style="text-align:left;padding:4px 0">(análise em cache)</div>':'');
  }catch(e){const jb=document.querySelector('.jar .jbody');if(jb)jb.innerHTML='<div class=load>Falha ao analisar.</div>';}
}
function cp(){navigator.clipboard.writeText(window._msg||'').then(()=>{const b=document.querySelector('.cp');if(b){b.textContent='✓ Copiado';setTimeout(()=>b.textContent='📋 Copiar mensagem',1500);}});}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeDrawer();});
carrega();setInterval(carrega,90000);
</script></body></html>
